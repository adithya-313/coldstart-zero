# apiVersion: v1 tells Kubernetes this is a core API object
apiVersion: v1
# kind: Secret means this resource stores sensitive data (tokens, passwords, keys)
kind: Secret
# metadata holds the name and labels that identify this resource
metadata:
  # name: coldstart-secret is the identifier used by Pods to reference this secret
  name: coldstart-secret
# type: Opaque means this secret holds arbitrary key-value pairs
type: Opaque
# stringData lets us write plain-text values (no base64 encoding needed).
# Kubernetes automatically encodes them to base64 when storing in etcd.
stringData:
  # cloud_token is the mock API key used by the init-provisioner to authenticate
  cloud_token: hf_mock_token_8a9b2c4d5e
