# apiVersion: v1 tells Kubernetes this is a core API object
apiVersion: v1
# kind: Service exposes a set of Pods as a network-accessible endpoint
kind: Service
metadata:
  # name: coldstart-api-service identifies this Service in the cluster
  name: coldstart-api-service
  # labels help select and group this Service
  labels:
    app: coldstart-api
spec:
  # type: ClusterIP exposes the Service only within the cluster (no external access)
  type: ClusterIP
  # selector routes traffic to Pods with the matching label (app: coldstart-api)
  selector:
    app: coldstart-api
  # ports maps incoming traffic to the target container port
  ports:
    # port: 80 is the Service port (other cluster services connect here)
    - port: 80
      # targetPort: 8080 forwards traffic to the container's Go server port
      targetPort: 8080
      # protocol: TCP is the default network protocol for HTTP traffic
      protocol: TCP
      # name: http helps identify this port mapping
      name: http
